[project]
name = "fidip"
version = "0.1.0"
description = "FiDIP research environment for Explorer (Linux/CUDA)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.3.1",
  "torchvision==0.18.1",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "scipy==1.14.0",
  "pillow==10.3.0",
  "pycocotools==2.0.8",
  "json-tricks==3.17.3",
  "yacs==0.1.8",
  "dsntnn==0.5.3",
  "tensorboard>=2.16,<3",
  "tensorboardx==2.6.2.2",
  "cython==3.0.10",
  "setuptools==69.5.1",
  "wheel==0.43.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
